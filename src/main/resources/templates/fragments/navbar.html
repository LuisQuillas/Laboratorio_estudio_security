<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Northwind</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-expand bg-dark navbar-dark px-3">
    <a class="navbar-brand" th:href="@{/product}">Northwind</a>

    <ul class="navbar-nav me-auto">
        <!-- Todos (anyRequest().permitAll()) -->
        <li class="nav-item"><a class="nav-link" th:href="@{/product}">Productos</a></li>

        <!-- admin y logistica -->
        <li class="nav-item" sec:authorize="hasAnyAuthority('admin','logistica')">
            <a class="nav-link" th:href="@{/employee}">Empleados</a>
        </li>

        <!-- solo admin -->
        <li class="nav-item" sec:authorize="hasAuthority('admin')">
            <a class="nav-link" th:href="@{/shipper}">Transportistas</a>
        </li>
    </ul>

    <!-- Sin sesion -->
    <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm" th:href="@{/loginForm}">Iniciar sesión</a>

    <!-- Con sesion: nombre guardado en el successHandler + logout por POST -->
    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2 text-white ms-3">
        <span th:text="${session.usuario?.nombre}">Usuario</span>
        (<span sec:authentication="name">correo</span>)
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
        </form>
    </div>
</nav>
</body>
</html>
