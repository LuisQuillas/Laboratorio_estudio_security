<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Iniciar sesión')}"></head>
<body>
<div class="container login-wrap">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-4 text-center">Iniciar sesión</h4>

            <!-- Spring redirige a /loginForm?error si falla el login -->
            <div class="alert alert-danger" th:if="${param.error}">
                Usuario o contraseña incorrectos
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Sesión cerrada correctamente
            </div>

            <!-- th:action agrega el token _csrf automaticamente -->
            <form th:action="@{/processLogin}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Correo</label>
                    <input class="form-control" type="email" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a th:href="@{/product}">Ver productos sin iniciar sesión</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
